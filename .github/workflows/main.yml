name: Compilar APK Android Gratuito

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Localizar Pasta do Projeto
        id: find_dir
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Erro: package.json não encontrado"
            exit 1
          fi
          WORK_DIR=$(dirname "$PKG_PATH")
          echo "work_dir=$WORK_DIR" >> $GITHUB_OUTPUT
          echo "Pasta encontrada: $WORK_DIR"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instalar Dependencias
        working-directory: ${{ steps.find_dir.outputs.work_dir }}
        run: npm install

      - name: Gerar Build do Web App
        working-directory: ${{ steps.find_dir.outputs.work_dir }}
        run: npm run build

      - name: Inicializar Capacitor Android
        working-directory: ${{ steps.find_dir.outputs.work_dir }}
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compilar APK
        working-directory: ${{ steps.find_dir.outputs.work_dir }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: FinanTrack-App-Android.apk
          path: ${{ steps.find_dir.outputs.work_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
