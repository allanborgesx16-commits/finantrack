name: Testar e compilar FinanTrack Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências verificadas
        run: npm ci
      - name: Testar valores e cálculos
        run: npm test
      - name: Compilar aplicativo web
        run: npm run build
      - name: Preparar Android
        run: |
          npx cap add android
          npx cap sync android
          node scripts/android-config.mjs
      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FinanTrack-2.0-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
